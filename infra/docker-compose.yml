# ContextIQ — full local stack (API + web + optional Postgres)
#
# Prerequisites (host):
#   1. Bake embeddings (once):
#        cd packages/ingestion && source .venv/bin/activate
#        contextiq-embed upsert --strategy structural --skip-postgres
#   2. From repo root:
#        docker compose -f infra/docker-compose.yml up --build
#
# Profiles:
#   default     → api + web
#   --profile db → also Postgres+pgvector
#
# Open: http://localhost:3000  ·  API: http://localhost:8787/health

name: contextiq

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      args:
        # Includes sentence-transformers so query vectors match the baked BGE cache.
        PIP_EXTRAS: "serve,local"
    image: contextiq-api:local
    container_name: contextiq-api
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      CONTEXTIQ_REPO_ROOT: /app
      CONTEXTIQ_EMBEDDING_PROVIDER: ${CONTEXTIQ_EMBEDDING_PROVIDER:-sbert}
      CONTEXTIQ_GENERATOR: ${CONTEXTIQ_GENERATOR:-extractive}
      CONTEXTIQ_AUTH_MODE: ${CONTEXTIQ_AUTH_MODE:-open}
      CONTEXTIQ_API_KEY: ${CONTEXTIQ_API_KEY:-}
      CONTEXTIQ_RATE_LIMIT_PER_MINUTE: ${CONTEXTIQ_RATE_LIMIT_PER_MINUTE:-30}
      CONTEXTIQ_CORS_ORIGINS: ${CONTEXTIQ_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - ../corpus/embeddings:/app/corpus/embeddings:ro
      - ../docs/eval-results:/app/docs/eval-results:ro
      - ../eval:/app/eval:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        # Browser → host port of the API (not the docker DNS name).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8787}
    image: contextiq-web:local
    container_name: contextiq-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  db:
    profiles: ["db"]
    image: pgvector/pgvector:pg16
    container_name: contextiq-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: contextiq
      POSTGRES_PASSWORD: contextiq
      POSTGRES_DB: contextiq
    ports:
      - "5433:5432"
    volumes:
      - contextiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextiq -d contextiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contextiq_pgdata:
