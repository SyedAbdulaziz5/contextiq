name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint · Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/ingestion/pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Syntax / compile check
        env:
          CONTEXTIQ_EMBEDDING_PROVIDER: hash
          CONTEXTIQ_GENERATOR: extractive
        run: python -m compileall -q src

      - name: Validate golden set
        working-directory: ${{ github.workspace }}
        run: python eval/validate_golden.py

      - name: Pytest
        env:
          CONTEXTIQ_EMBEDDING_PROVIDER: hash
          CONTEXTIQ_GENERATOR: extractive
        run: pytest -q

  web:
    name: Typecheck (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8787
        run: npm run build
