name: RAG Evaluation

on:
  pull_request:
    paths:
      - "packages/ingestion/**"
      - "eval/**"
      - "docs/eval-results/**"
      - "corpus/sources.json"
      - ".github/workflows/eval.yml"
  push:
    branches: [main, master]
    paths:
      - "packages/ingestion/**"
      - "eval/**"
      - "docs/eval-results/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rag-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rag-gate:
    name: Compare metrics · PASS/FAIL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/ingestion/pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Metric unit tests
        env:
          CONTEXTIQ_EMBEDDING_PROVIDER: hash
          CONTEXTIQ_GENERATOR: extractive
        run: pytest tests/test_evaluation.py tests/test_ci_gate.py tests/test_generation.py -q

      - name: Resolve PR label
        id: meta
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr_label=PR #${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_label=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: RAG evaluation gate
        id: gate
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          contextiq-eval gate \
            --pr-label "${{ steps.meta.outputs.pr_label }}" \
            --baseline-label main \
            --report eval/ci/gate-report.md \
            --json-out eval/ci/gate-result.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-gate-report
          path: |
            eval/ci/gate-report.md
            eval/ci/gate-result.json
          if-no-files-found: warn

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'eval/ci/gate-report.md';
            let body;
            if (fs.existsSync(path)) {
              body = fs.readFileSync(path, 'utf8');
            } else {
              body = '## RAG Evaluation\n\n❌ Gate did not produce a report. Ensure `docs/eval-results/rag-metrics.json` is present on the PR branch.';
            }
            const marker = '<!-- contextiq-rag-gate -->';
            body = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if gate failed
        if: steps.gate.outputs.exit_code != '0'
        run: |
          echo "❌ RAG evaluation gate failed — merge blocked."
          cat "${{ github.workspace }}/eval/ci/gate-report.md" || true
          exit 1
